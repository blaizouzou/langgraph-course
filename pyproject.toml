[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blaise Carnevillier", email = "Blaise Carnevillier@hotmail.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "grandalf>=0.8",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-course = "langgraph_course:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
